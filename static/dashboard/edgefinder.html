<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WildChance · EdgeFinder</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#131a26; --panel2:#0f1520; --line:#1f2937;
    --ink:#e6edf6; --muted:#8b97a8; --accent:#3b82f6;
    --slong:#0f9d58; --long:#3ecf8e; --neutral:#5b6b80;
    --short:#f0654a; --sshort:#e11d48;
    --chip-pos:#123524; --chip-pos-ink:#4ade80;
    --chip-neg:#3a1620; --chip-neg-ink:#fb7185;
    --chip-zero:#1a2230; --chip-zero-ink:#93a4bb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#152033 0,var(--bg) 55%);
    color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    padding:14px 20px;background:rgba(11,15,23,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;letter-spacing:.3px;font-size:18px}
  .brand span{color:var(--accent)}
  .spacer{flex:1}
  .ctrl{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
  button,.toggle{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:9px;padding:7px 12px;font-size:13px}
  button:hover{border-color:var(--accent)}
  .toggle.on{background:#16233a;border-color:var(--accent);color:#cfe0ff}
  .stamp{color:var(--muted);font-size:12px}
  main{padding:20px;max-width:1280px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:16px;padding:16px;position:relative;overflow:hidden;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-2px);border-color:#2b3a55;cursor:pointer}
  .card .edge{position:absolute;left:0;top:0;bottom:0;width:5px}
  .row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .pair{font-weight:700;font-size:17px;letter-spacing:.3px}
  .price{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
  .bias{margin:10px 0 4px;font-weight:800;font-size:20px;letter-spacing:.4px}
  .meter{height:8px;border-radius:6px;background:#0c121c;position:relative;margin:8px 0 12px;border:1px solid #10182600}
  .meter .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#33415580}
  .meter .fill{position:absolute;top:0;bottom:0;border-radius:6px}
  .factors{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .f{display:flex;gap:9px;align-items:flex-start;font-size:12.5px}
  .chip{flex:none;min-width:34px;text-align:center;border-radius:7px;padding:2px 6px;font-weight:700;font-variant-numeric:tabular-nums}
  .chip.pos{background:var(--chip-pos);color:var(--chip-pos-ink)}
  .chip.neg{background:var(--chip-neg);color:var(--chip-neg-ink)}
  .chip.zero{background:var(--chip-zero);color:var(--chip-zero-ink)}
  .fname{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.6px;margin-top:2px;min-width:44px}
  .fnote{color:#c3cee0}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .verdict{font-weight:700}
  .news{margin-top:10px;background:#2a1e0a;border:1px solid #4a3410;color:#f6c56b;border-radius:9px;padding:7px 9px;font-size:12px}
  .empty{color:var(--muted);text-align:center;padding:60px 20px}
  .demo{display:inline-block;margin-left:8px;font-size:11px;color:#f6c56b;border:1px solid #4a3410;background:#2a1e0a;border-radius:6px;padding:2px 7px}
  .spin{width:14px;height:14px;border:2px solid #33415580;border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .detail{margin-top:10px;font-size:12px;color:#aeb9cb;border-top:1px dashed var(--line);padding-top:8px;display:none;white-space:pre-wrap}
  .card.open .detail{display:block}
</style>
</head>
<body>
<header>
  <div class="brand">Wild<span>Chance</span> · EdgeFinder</div>
  <span id="demoBadge" class="demo" style="display:none">demo data — API unreachable</span>
  <div class="spacer"></div>
  <div class="ctrl">
    <span class="toggle" id="mmmToggle" title="Fold in the MMM weekly-cycle bias (slower)">＋ MMM</span>
    <button id="refresh">↻ Refresh</button>
    <span class="stamp" id="stamp">—</span>
  </div>
</header>
<main>
  <div class="grid" id="grid"><div class="empty"><span class="spin"></span> Loading bias board…</div></div>
</main>

<script>
const BIAS_COLOR = {
  "STRONG LONG":"var(--slong)","LONG":"var(--long)","NEUTRAL":"var(--neutral)",
  "SHORT":"var(--short)","STRONG SHORT":"var(--sshort)"
};
const MAXSCORE = 6;
let withMMM = false, timer = null;

function chip(score){
  const cls = score>0?"pos":score<0?"neg":"zero";
  const s = score>0?("+"+score):(""+score);
  return `<span class="chip ${cls}">${s}</span>`;
}
function meter(score){
  const pct = Math.max(-1,Math.min(1, score/MAXSCORE));
  const w = Math.abs(pct)*50;
  const color = score>0?"var(--long)":score<0?"var(--short)":"var(--neutral)";
  const left = score>=0?50:50-w;
  return `<div class="meter"><div class="mid"></div>
    <div class="fill" style="left:${left}%;width:${w||1.5}%;background:${color}"></div></div>`;
}
function card(r){
  const color = BIAS_COLOR[r.bias]||"var(--neutral)";
  const factors = (r.factors||[]).map(f=>`
    <div class="f">${chip(f.score)}<span class="fname">${f.name}</span>
      <span class="fnote">${f.note||""}</span></div>`).join("");
  const news = r.news?`<div class="news">${r.news}</div>`:"";
  const price = r.price!=null?`<span class="price">${r.price}</span>`:"";
  const conf = r.system_confidence!=null?` · conf ${r.system_confidence}%`:"";
  return `<div class="card" data-pair="${r.pair}">
    <div class="edge" style="background:${color}"></div>
    <div class="row1"><span class="pair">${r.pair}</span>${price}</div>
    <div class="bias" style="color:${color}">${r.bias}</div>
    ${meter(r.score)}
    <div class="factors">${factors}</div>
    ${news}
    <div class="foot"><span class="verdict">score ${r.score>=0?"+"+r.score:r.score}</span>
      <span>system: ${r.system_verdict||"—"}${conf}</span></div>
    <div class="detail" data-loaded="0">click to load MMM weekly-cycle detail…</div>
  </div>`;
}

async function load(){
  const grid = document.getElementById("grid");
  document.getElementById("stamp").innerHTML = '<span class="spin"></span> updating…';
  let data=null, demo=false;
  try{
    const res = await fetch(`/edgefinder?mmm=${withMMM}`, {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    data = await res.json();
  }catch(e){ data = SAMPLE; demo=true; }
  document.getElementById("demoBadge").style.display = demo?"inline-block":"none";
  const board = (data && data.board) || [];
  if(!board.length){ grid.innerHTML = `<div class="empty">No signals in the feed yet. Run a wildchance scrape, then refresh.</div>`; }
  else { grid.innerHTML = board.map(card).join(""); }
  const when = (data && data.as_of) ? new Date(data.as_of).toLocaleString() : new Date().toLocaleTimeString();
  document.getElementById("stamp").textContent = (demo?"demo · ":"")+"updated "+when;
  bindCards();
}

function bindCards(){
  document.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click", async ()=>{
      c.classList.toggle("open");
      const d = c.querySelector(".detail");
      if(c.classList.contains("open") && d.dataset.loaded==="0"){
        d.dataset.loaded="1";
        try{
          const res = await fetch(`/edgefinder/${encodeURIComponent(c.dataset.pair)}`,{cache:"no-store"});
          const j = await res.json();
          const m = j.mmm_read||{};
          d.textContent =
            `Taylor day: ${m.taylor_day||"—"}\n`+
            `Weekly cycle: ${m.weekly_cycle_bias||"—"}\n`+
            `Level: ${m.level_context||"—"}\n`+
            `ADR used: ${m.adr_used!=null?m.adr_used+"×":"—"}\n`+
            `Peak/reversal: ${(m.peak_formation&&m.peak_formation.reversal)||"none"}`;
        }catch(e){ d.textContent = "detail unavailable (demo / offline)"; }
      }
    });
  });
}

document.getElementById("refresh").onclick = load;
document.getElementById("mmmToggle").onclick = (e)=>{
  withMMM = !withMMM; e.target.classList.toggle("on", withMMM); load();
};
load();
timer = setInterval(load, 60000);   // auto-refresh each minute

// Sample data — used only when /edgefinder is unreachable (standalone preview).
const SAMPLE = {as_of:new Date().toISOString(), with_mmm:true, count:5, board:[
  {pair:"GBP/USD",price:1.33497,bias:"STRONG SHORT",score:-6,system_verdict:"SHORT",system_confidence:82,
   retail_long:74,cot_net:-52000,cot_rank:0.12,news:"⚠️ GBP BOE Bailey Speaks; USD NFP 2026-07-03",
   factors:[{name:"retail",score:-2,note:"74%L crowded → contrarian short (×2)"},
            {name:"cot",score:-2,note:"COT short (net -52000, rank 0.12) extreme (×2)"},
            {name:"mmm",score:-2,note:"MMM weekly-cycle short"}]},
  {pair:"EUR/USD",price:1.14344,bias:"LONG",score:2,system_verdict:"LONG",system_confidence:64,
   retail_long:38,cot_net:41000,cot_rank:0.71,news:null,
   factors:[{name:"retail",score:1,note:"38%L crowded short → contrarian long (×1)"},
            {name:"cot",score:1,note:"COT long (net 41000, rank 0.71) (×1)"},
            {name:"mmm",score:0,note:"MMM weekly-cycle neutral"}]},
  {pair:"XAU/USD",price:4123.18,bias:"LONG",score:3,system_verdict:"LONG",system_confidence:70,
   retail_long:41,cot_net:180000,cot_rank:0.83,news:"⚠️ USD NFP 2026-07-03",
   factors:[{name:"retail",score:1,note:"41%L → contrarian long (×1)"},
            {name:"cot",score:2,note:"COT long, rank 0.83 extreme (×2)"},
            {name:"mmm",score:0,note:"MMM weekly-cycle neutral"}]},
  {pair:"USD/JPY",price:161.079,bias:"SHORT",score:-2,system_verdict:"WATCH",system_confidence:48,
   retail_long:63,cot_net:-12000,cot_rank:0.44,news:"⚠️ USD NFP 2026-07-03",
   factors:[{name:"retail",score:-1,note:"63%L → contrarian short (×1)"},
            {name:"cot",score:-1,note:"COT short (×1)"},
            {name:"mmm",score:0,note:"MMM weekly-cycle neutral"}]},
  {pair:"AUD/USD",price:0.69228,bias:"NEUTRAL",score:0,system_verdict:"FLAT",system_confidence:40,
   retail_long:52,cot_net:null,cot_rank:null,news:null,
   factors:[{name:"retail",score:0,note:"52%L balanced — no contrarian edge"},
            {name:"cot",score:0,note:"no COT data"},{name:"mmm",score:0,note:"no MMM read"}]}
]};
</script>
</body>
</html>
