name: scheduled-scans

# Robust scheduling: each cron does ONE job, dispatched by github.event.schedule
# (the cron expression that fired) — NOT by wall-clock hour, because GitHub's
# free scheduler often delays runs by 10–60 min.
#
# Required repo secret:  APP_BASE_URL   e.g. https://wildchance-system.onrender.com
# Optional repo variable: USDJPY_ACCOUNT_SIZE
#
# All times UTC. Session setup digests fire at 05:00 / 09:00 / 17:00 / 21:00 UTC.

on:
  schedule:
    - cron: "0 5 * * *"         # USD/JPY scan + "Before New York" setup digest
    - cron: "0 9 * * *"         # "New York" setup digest
    - cron: "0 17 * * *"        # "After open" setup digest
    - cron: "0 21 * * *"        # "Asian open" setup digest
    - cron: "0 6 * * *"         # wildchance daily (retail + calendar + prices)
    - cron: "0 0,12,18 * * *"   # wildchance 6h (prices + recompute signals)
    - cron: "0 21 * * 5"        # wildchance weekly COT (Fri, after CFTC release)
    - cron: "0 8 1 * *"         # monthly performance scorecard (1st of month, 08:00 UTC)
  workflow_dispatch:             # manual run = full test (forces a digest)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scans
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          ACCT: ${{ vars.USDJPY_ACCOUNT_SIZE }}
          SCHED: ${{ github.event.schedule }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$BASE" ]; then echo "::error::APP_BASE_URL secret not set"; exit 1; fi
          ACCT="${ACCT:-0}"

          post () {  # post <path>
            echo "POST $BASE$1"
            code=$(curl -s -m 90 -o /tmp/body -w "%{http_code}" -X POST "$BASE$1") || true
            echo "  -> HTTP $code"
            head -c 500 /tmp/body; echo
          }

          if [ "$MANUAL" = "true" ]; then
            echo "Manual run — usdjpy scan + refresh + forced session digest"
            post "/usdjpy/scan?account_size=$ACCT&notify=true"
            post "/wildchance/scrape?tier=6h"
            post "/alerts/session?label=Manual%20test&force=true"
            post "/scorecard/digest?force=true"
            exit 0
          fi

          echo "Triggered by schedule: '$SCHED'"
          case "$SCHED" in
            "0 5 * * *")
              post "/usdjpy/scan?account_size=$ACCT&notify=true"
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=Before%20New%20York"
              ;;
            "0 9 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=New%20York"
              ;;
            "0 17 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=After%20open"
              ;;
            "0 21 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=Asian%20open"
              ;;
            "0 6 * * *")        post "/wildchance/scrape?tier=daily" ;;
            "0 0,12,18 * * *")  post "/wildchance/scrape?tier=6h" ;;
            "0 21 * * 5")       post "/wildchance/scrape?tier=weekly" ;;
            "0 8 1 * *")        post "/scorecard/digest" ;;
            *) echo "no action for schedule '$SCHED'" ;;
          esac
