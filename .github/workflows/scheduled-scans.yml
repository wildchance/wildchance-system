name: scheduled-scans

# Robust scheduling: each cron does ONE job, dispatched by github.event.schedule
# (the cron expression that fired) — NOT by wall-clock hour, because GitHub's
# free scheduler often delays runs by 10–60 min.
#
# Required repo secret:  APP_BASE_URL   e.g. https://wildchance-system.onrender.com
# Optional repo variable: USDJPY_ACCOUNT_SIZE
#
# All times UTC. Session setup digests fire at 05:00 / 09:00 / 17:00 / 21:00 UTC.

on:
  schedule:
    - cron: "0 5 * * *"         # USD/JPY scan + "Before New York" setup digest
    - cron: "0 9 * * *"         # "New York" setup digest
    - cron: "0 17 * * *"        # "After open" setup digest
    - cron: "0 21 * * *"        # "Asian open" setup digest
    - cron: "0 6 * * *"         # wildchance daily (retail + calendar + prices)
    - cron: "0 0,12,18 * * *"   # wildchance 6h (prices + recompute signals)
    - cron: "0 21 * * 5"        # wildchance weekly COT (Fri, after CFTC release)
    - cron: "0 8 1 * *"         # monthly performance scorecard (1st of month, 08:00 UTC)
    - cron: "0 * * * *"         # hourly intraday breach scan (1h z-score)
    - cron: "0 22 * * 0"        # weekly performance review (Sun 22:00 UTC)
    - cron: "0 3 * * *"         # pre-London CBDR box + SD levels (after 02:45 UTC close)
    - cron: "5 2 * * *"         # candle-range read after the 01:00 UTC candle closes
    - cron: "5 14 * * *"        # candle-range read after the 13:00 UTC candle closes
    - cron: "0 7 1 1,4,7,10 *"  # yearly Quarterly-Theory phase (start of each quarter)
    - cron: "30 8 * * 1"        # Benner cycle phase (Mondays 08:30 UTC)
    - cron: "30 6 * * *"        # EdgeFinder top-bias digest (after the 06:00 daily scrape)
  workflow_dispatch:             # manual run = full test (forces every digest)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scans
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          ACCT: ${{ vars.USDJPY_ACCOUNT_SIZE }}
          SCHED: ${{ github.event.schedule }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$BASE" ]; then echo "::error::APP_BASE_URL secret not set"; exit 1; fi
          ACCT="${ACCT:-0}"

          post () {  # post <path>
            echo "POST $BASE$1"
            code=$(curl -s -m 90 -o /tmp/body -w "%{http_code}" -X POST "$BASE$1") || true
            echo "  -> HTTP $code"
            head -c 500 /tmp/body; echo
          }

          if [ "$MANUAL" = "true" ]; then
            echo "Manual run — usdjpy scan + refresh + forced digests"
            post "/usdjpy/scan?account_size=$ACCT&notify=true"
            post "/wildchance/scrape?tier=6h"
            post "/alerts/session?label=Manual%20test&force=true"
            post "/intraday/scan?force=true"
            post "/scorecard/digest?force=true"
            post "/scorecard/weekly?force=true"
            post "/cbdr/alert/USD/JPY?window=prelondon"
            post "/candlerange/scan?force=true"
            post "/quarterly/alert/USD/JPY"
            post "/autoalert/confluence?min_confidence=85"
            post "/benner/alert"
            post "/edgefinder/digest?force=true"
            exit 0
          fi

          echo "Triggered by schedule: '$SCHED'"
          case "$SCHED" in
            "0 5 * * *")
              post "/usdjpy/scan?account_size=$ACCT&notify=true"
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=Before%20New%20York"
              ;;
            "0 9 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=New%20York"
              ;;
            "0 17 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=After%20open"
              ;;
            "0 21 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=Asian%20open"
              ;;
            "0 6 * * *")        post "/wildchance/scrape?tier=daily" ;;
            "0 0,12,18 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/autoalert/confluence?min_confidence=85"
              ;;
            "0 21 * * 5")       post "/wildchance/scrape?tier=weekly" ;;
            "0 8 1 * *")        post "/scorecard/digest" ;;
            "0 * * * *")        post "/intraday/scan" ;;
            "0 22 * * 0")       post "/scorecard/weekly" ;;
            "0 3 * * *")
              # Pre-London CBDR box + SD levels for the key set
              post "/cbdr/alert/USD/JPY?window=prelondon"
              post "/cbdr/alert/EUR/USD?window=prelondon"
              post "/cbdr/alert/GBP/USD?window=prelondon"
              post "/cbdr/alert/XAU/USD?window=prelondon"
              ;;
            "5 2 * * *")        post "/candlerange/scan" ;;
            "5 14 * * *")       post "/candlerange/scan" ;;
            "0 7 1 1,4,7,10 *")
              # Yearly Quarterly-Theory phase + box for the key set
              post "/quarterly/alert/USD/JPY"
              post "/quarterly/alert/EUR/USD"
              post "/quarterly/alert/XAU/USD"
              post "/quarterly/alert/NAS100"
              ;;
            "30 8 * * 1")       post "/benner/alert" ;;
            "30 6 * * *")       post "/edgefinder/digest" ;;
            *) echo "no action for schedule '$SCHED'" ;;
          esac
