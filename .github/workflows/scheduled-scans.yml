name: scheduled-scans

# Robust scheduling: each cron does ONE job, dispatched by github.event.schedule
# (the cron expression that fired) — NOT by wall-clock hour, because GitHub's
# free scheduler often delays runs by 10–60 min.
#
# Required repo secret:  APP_BASE_URL   e.g. https://wildchance-system.onrender.com
# Optional repo variable: USDJPY_ACCOUNT_SIZE
#
# All times UTC. Session setup digests fire at 05:00 / 09:00 / 17:00 / 21:00 UTC.

on:
  schedule:
    - cron: "0 5 * * *"         # USD/JPY scan + "Before New York" setup digest
    - cron: "0 9 * * *"         # "New York" setup digest
    - cron: "0 17 * * *"        # "After open" setup digest
    - cron: "0 21 * * *"        # "Asian open" setup digest
    - cron: "0 6 * * *"         # wildchance daily (retail + calendar + prices)
    - cron: "0 0,12,18 * * *"   # wildchance 6h (prices + recompute signals)
    - cron: "0 21 * * 5"        # wildchance weekly COT (Fri, after CFTC release)
    - cron: "0 8 1 * *"         # monthly performance scorecard (1st of month, 08:00 UTC)
    - cron: "0 * * * *"         # hourly intraday breach scan (1h z-score) + gold swing monitor
    - cron: "0 22 * * 0"        # weekly review + Sunday/weekly-open gold swing + Asian gold CBDR
    - cron: "0 7 * 3-10 *"      # pre-London limits — summer (EDT): 07:00 UTC = 03:00 ET
    - cron: "0 8 * 11,12,1,2 *" # pre-London limits — winter (EST): 08:00 UTC = 03:00 ET
    - cron: "0 2 * * 1-5"       # Asia accumulation — gold intrasession scan
    - cron: "55 20 * * 5"       # Friday pre-close 1h read — Monday-gap anticipation
    #  (1am/1pm hourly CRT/candle-range crons removed — kept only the Friday close)
    - cron: "0 7 1 1,4,7,10 *"  # yearly Quarterly-Theory phase (start of each quarter)
    - cron: "30 8 * * 1"        # Benner cycle phase (Mondays 08:30 UTC)
    - cron: "30 6 * * *"        # EdgeFinder top-bias digest (after the 06:00 daily scrape)
    - cron: "0 7 * * 1-5"       # GOLD scan + intraday — London open Q2 (weekdays)
    - cron: "0 13 * * 1-5"      # GOLD scan + intraday — New York open Q3 (weekdays)
    - cron: "30 13 * * 1-5"     # GOLD intraday — NY-AM distribution window (weekdays)
    - cron: "30 2 * * 1-5"      # GOLD session-OR breakout — Asia (intrasession, $15-25)
    - cron: "0 10 * * 1-5"      # GOLD session-OR breakout — London ($50 / 500 pips)
    - cron: "0 15 * * 1-5"      # GOLD session-OR breakout — New York ($50 / 500 pips, primary)
  workflow_dispatch:             # manual run = full test (forces every digest)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scans
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          ACCT: ${{ vars.USDJPY_ACCOUNT_SIZE }}
          SCHED: ${{ github.event.schedule }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$BASE" ]; then echo "::error::APP_BASE_URL secret not set"; exit 1; fi
          ACCT="${ACCT:-0}"

          post () {  # post <path>
            echo "POST $BASE$1"
            code=$(curl -s -m 90 -o /tmp/body -w "%{http_code}" -X POST "$BASE$1") || true
            echo "  -> HTTP $code"
            head -c 500 /tmp/body; echo
          }

          if [ "$MANUAL" = "true" ]; then
            echo "Manual run — usdjpy scan + refresh + forced digests"
            post "/usdjpy/scan?account_size=$ACCT&notify=true"
            post "/wildchance/scrape?tier=6h"
            post "/alerts/session?label=Manual%20test&force=true"
            post "/intraday/scan?force=true"
            post "/scorecard/digest?force=true"
            post "/scorecard/weekly?force=true"
            post "/cbdr/alert/USD/JPY?window=prelondon"
            post "/cbdr/limits/XAU/USD?window=prelondon&notify=true"
            post "/candlerange/friday?force=true"
            post "/gold/prelondon?track=true"
            post "/gold/sd-fade?track=true"
            post "/gold/news"
            post "/quarterly/alert/USD/JPY"
            post "/autoalert/confluence?min_confidence=85"
            post "/benner/alert"
            post "/edgefinder/snapshot"
            post "/edgefinder/digest?force=true"
            post "/gold/scan?balance=5000&notify=true"
            post "/gold/intraday?balance=5000&notify=true"
            post "/cbdr/alert/XAU/USD?window=trade4"
            post "/gold/monitor"
            post "/gold/scorecard/digest?force=true"
            exit 0
          fi

          echo "Triggered by schedule: '$SCHED'"
          case "$SCHED" in
            "0 5 * * *")
              post "/usdjpy/scan?account_size=$ACCT&notify=true"
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=Before%20New%20York"
              ;;
            "0 9 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=New%20York"
              ;;
            "0 17 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=After%20open"
              ;;
            "0 21 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/alerts/session?label=Asian%20open"
              ;;
            "0 6 * * *")
              post "/wildchance/scrape?tier=daily"
              post "/gold/news"        # refresh the tier-1 news calendar daily
              ;;
            "0 0,12,18 * * *")
              post "/wildchance/scrape?tier=6h"
              post "/autoalert/confluence?min_confidence=85"
              ;;
            "0 21 * * 5")
              post "/wildchance/scrape?tier=weekly"
              post "/gold/regime/refresh"    # pull live FRED + CFTC gold COT
              ;;
            "0 8 1 * *")        post "/scorecard/digest" ;;
            "0 * * * *")
              post "/intraday/scan"
              post "/gold/monitor"     # trail/close tracked gold swings (TP/SL/time-stop)
              ;;
            "0 22 * * 0")
              # Weekly review + the Sunday/weekly-open gold swing (the edge: buy the
              # discount pullback) + the Asian-hours gold CBDR box + gold scorecard.
              post "/scorecard/weekly"
              post "/gold/scan?balance=5000&notify=true"
              post "/cbdr/alert/XAU/USD?window=trade4"
              post "/gold/monitor"
              post "/gold/scorecard/digest"
              ;;
            "0 7 * 3-10 *"|"0 8 * 11,12,1,2 *")
              # Pre-London CBDR at 03:00 ET year-round (summer 07:00 UTC / winter
              # 08:00 UTC; window closes 02:45 ET). FX get the box + SD levels; gold
              # gets the limit plan (buy −1SD, sell +1/+3SD, 1–1.5SD grey zone).
              post "/cbdr/alert/USD/JPY?window=prelondon"
              post "/cbdr/alert/EUR/USD?window=prelondon"
              post "/cbdr/alert/GBP/USD?window=prelondon"
              post "/cbdr/limits/XAU/USD?window=prelondon&notify=true"
              post "/gold/prelondon?track=true&execute=true"    # arm tracked + enqueue MT5 limits
              ;;
            "0 2 * * 1-5")
              # Asia accumulation window — gold intrasession scan
              post "/gold/intraday?balance=5000&notify=true"
              ;;
            "55 20 * * 5")
              # Friday pre-close — Monday-gap anticipation (the reliable candle read).
              # The 1am/1pm CRT + candle-range scans were removed; only Friday remains.
              post "/candlerange/friday"
              ;;
            "0 7 1 1,4,7,10 *")
              # Yearly Quarterly-Theory phase + box for the key set
              post "/quarterly/alert/USD/JPY"
              post "/quarterly/alert/EUR/USD"
              post "/quarterly/alert/XAU/USD"
              post "/quarterly/alert/NAS100"
              ;;
            "30 8 * * 1")       post "/benner/alert" ;;
            "30 6 * * *")
              post "/edgefinder/snapshot"
              post "/edgefinder/digest"
              ;;
            "0 7 * * 1-5")
              post "/gold/scan?balance=5000&notify=true"
              post "/gold/intraday?balance=5000&notify=true"
              ;;
            "0 13 * * 1-5")
              post "/gold/scan?balance=5000&notify=true"
              post "/gold/intraday?balance=5000&notify=true"
              ;;
            "30 13 * * 1-5")    post "/gold/intraday?balance=5000&require_distribution=true&notify=true" ;;
            "30 2 * * 1-5")
              # Asia opening-range breakout — intrasession scalps, 150 pips ($15) floor,
              # room-filtered so exhausted Asia sessions are skipped.
              post "/gold/session-breakout?session=asia&min_target_pips=150&notify=true"
              ;;
            "0 10 * * 1-5")
              # London opening-range breakout (OR 08:00-09:00, run after it forms) —
              # 500 pips ($50) projected-target + ADR room-to-run filter.
              post "/gold/session-breakout?session=london&min_target_pips=500&notify=true"
              ;;
            "0 15 * * 1-5")
              # New York opening-range breakout (OR 13:00-14:00) — the primary $50 mover.
              post "/gold/session-breakout?session=ny&min_target_pips=500&notify=true"
              ;;
            *) echo "no action for schedule '$SCHED'" ;;
          esac
