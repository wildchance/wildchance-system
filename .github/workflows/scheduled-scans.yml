name: scheduled-scans

# BACKUP clock only. The schedule itself lives in the app (services/cron_schedule.py,
# DST-aware, de-duplicated). The primary clock is cron-job.org calling
# GET /cron/tick every 5 minutes; this hourly run catches up anything it missed.
# GitHub's own cron is best-effort (it went silent for hours after re-enabling),
# so it must not be the only trigger.
#
# Required repo secrets:  APP_BASE_URL  (e.g. https://wildchance-system.onrender.com)
#                         CRON_TOKEN    (same value as CRON_TOKEN in Render)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Run one job now (name from /cron/jobs), or leave empty for a normal tick"
        required: false
        default: ""

jobs:
  tick:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # keepalive step below re-enables this workflow
      contents: read
    steps:
      - name: Keepalive (stop GitHub's 60-day inactivity auto-disable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scheduled-scans.yml/enable" || echo "keepalive skipped"

      - name: Tick the in-app scheduler
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          TOKEN: ${{ secrets.CRON_TOKEN }}
          JOB: ${{ github.event.inputs.job }}
        run: |
          if [ -z "$BASE" ] || [ -z "$TOKEN" ]; then
            echo "::error::set repo secrets APP_BASE_URL and CRON_TOKEN"; exit 1
          fi
          if [ -n "$JOB" ]; then url="$BASE/cron/run?job=$JOB"; else url="$BASE/cron/tick"; fi
          # first call may wake a sleeping Render instance (~1 min)
          code=$(curl -s -m 120 -o /tmp/body -w "%{http_code}" -H "X-Cron-Token: $TOKEN" "$url") || true
          echo "GET $url -> HTTP $code"; cat /tmp/body; echo
          [ "$code" = "200" ] || { echo "::error::tick failed (HTTP $code)"; exit 1; }
          sleep 60
          echo "--- /cron/status (last tick) ---"
          curl -s -m 60 "$BASE/cron/status" | head -c 3000; echo
